name: Build XR30 eMMC OpenWrt (Clean + Argon Theme)

on:
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip libpython3-dev qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: Clone source (hanwckf immortalwrt-mt798x, openwrt-21.02)
        run: |
          git clone --depth 1 -b openwrt-21.02 https://github.com/hanwckf/immortalwrt-mt798x.git openwrt

      - name: Apply feeds.conf.default (clean + argon)
        run: |
          cp adapt/feeds-clean.conf.default openwrt/feeds.conf.default

      - name: Update & install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply config (cmcc_xr30-emmc + argon, no extra plugins)
        run: |
          cp adapt/xr30-clean-theme.config openwrt/.config
          cd openwrt
          make defconfig

      - name: 强制恢复第三方包配置（修复 defconfig 丢弃 =y）
        run: |
          cd openwrt
          CFG=../adapt/xr30-clean-theme.config
          grep '^CONFIG_PACKAGE_.*=y' "$CFG" > /tmp/pkgs-wanted.txt || true
          echo "原始 config 启用包数: $(wc -l < /tmp/pkgs-wanted.txt)"
          while IFS= read -r line; do
            sym="${line%%=*}"
            sed -i "/^# ${sym} is not set$/d; /^${sym}=/d" .config
            echo "$line" >> .config
          done < /tmp/pkgs-wanted.txt
          echo "=== 恢复后启用的 LuCI 应用/主题 ==="
          grep -E '^CONFIG_PACKAGE_(luci-app-|luci-theme-).*=y' .config | head -40 || true

      - name: Verify target device is XR30 eMMC (guard against NAND/eMMC mix-up)
        run: |
          cd openwrt
          if ! grep -q '^CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_cmcc_xr30-emmc=y' .config; then
            echo "::error::Target is not cmcc_xr30-emmc (XR30 eMMC), aborting"
            exit 1
          fi
          if grep -q '^CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_cmcc_xr30=y' .config; then
            echo "::error::cmcc_xr30 (XR30 NAND) also enabled, aborting"
            exit 1
          fi
          echo "Target confirmed: XR30 eMMC (cmcc_xr30-emmc)"

      - name: Run diy-part1
        working-directory: openwrt
        run: bash ../adapt/diy-clean-part1.sh

      - name: Run diy-part2
        working-directory: openwrt
        run: bash ../adapt/diy-clean-part2.sh

      - name: Download packages
        working-directory: openwrt
        run: make download -j$(nproc)

      - name: Compile firmware
        working-directory: openwrt
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: 校验关键包确实编入固件（manifest 防呆）
        run: |
          cd openwrt
          MAN=$(ls bin/targets/mediatek/mt7981/*.manifest 2>/dev/null | head -1)
          if [ -z "$MAN" ]; then echo "::error::未找到 manifest，无法确认包是否编入"; exit 1; fi
          echo "=== manifest 中的 LuCI 应用/主题 ==="
          grep -E '^luci-(app|theme)-' "$MAN" || true
          PKGS="luci-theme-argon"
          for p in $PKGS; do
            if ! grep -qE "^${p}( |$)" "$MAN"; then
              echo "::error::${p} 未编入固件，中止以免交付空壳"
              exit 1
            fi
          done
          echo "✅ 关键包校验通过: $PKGS"

      - name: Collect firmware
        working-directory: openwrt
        run: |
          mkdir -p ../firmware-out
          find bin/targets -name '*cmcc_xr30-emmc*' -exec cp {} ../firmware-out/ \;
          cp bin/targets/mediatek/mt7981/*.manifest ../firmware-out/ 2>/dev/null || true
          ls -lh ../firmware-out
          if ! ls ../firmware-out/*cmcc_xr30-emmc* &>/dev/null; then
            echo "::error::未找到 cmcc_xr30-emmc (XR30 eMMC) 产物，编译中止"
            exit 1
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: xr30-emmc-clean-argon-firmware
          path: firmware-out/*

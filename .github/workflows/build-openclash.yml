name: Build XR30 eMMC OpenWrt (openclash only)

on:
  workflow_dispatch:
  # 如需定时自动编译，取消下面注释（UTC 时间，以下为每天北京时间 02:00）
  # schedule:
  #   - cron: '0 18 * * *'

env:
  DEBIAN_FRONTEND: noninteractive
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout 本仓库（配置文件与脚本）
        uses: actions/checkout@v4

      - name: 释放 Runner 磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: 克隆源码（hanwckf immortalwrt-mt798x, 分支 openwrt-21.02）
        run: |
          git clone --depth=1 https://github.com/hanwckf/immortalwrt-mt798x -b openwrt-21.02 openwrt

      - name: 拷贝配置 / feeds / diy 脚本到源码
        run: |
          cd openwrt
          cp ../adapt/feeds-openclash.conf.default feeds.conf.default
          cp ../adapt/xr30-openclash.config .config
          cp ../adapt/diy-openclash-part1.sh diy-part1.sh
          cp ../adapt/diy-openclash-part2.sh diy-part2.sh
          chmod +x diy-part1.sh diy-part2.sh

      - name: 执行 diy-part1（feeds update 之前）
        run: cd openwrt && bash ./diy-part1.sh

      - name: 更新 feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: 安装 feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: 执行 diy-part2（feeds install 之后）
        run: cd openwrt && bash ./diy-part2.sh

      - name: 配置（defconfig）
        run: |
          cd openwrt
          make defconfig

      - name: 强制恢复第三方包配置（修复 defconfig 丢弃 =y）
        run: |
          cd openwrt
          CFG=../adapt/xr30-openclash.config
          grep '^CONFIG_PACKAGE_.*=y' "$CFG" > /tmp/pkgs-wanted.txt || true
          echo "原始 config 启用包数: $(wc -l < /tmp/pkgs-wanted.txt)"
          while IFS= read -r line; do
            sym="${line%%=*}"
            sed -i "/^# ${sym} is not set$/d; /^${sym}=/d" .config
            echo "$line" >> .config
          done < /tmp/pkgs-wanted.txt
          echo "=== 恢复后启用的 LuCI 应用/主题 ==="
          grep -E '^CONFIG_PACKAGE_(luci-app-|luci-theme-).*=y' .config | head -40 || true

      - name: 校验目标设备必须是 XR30 eMMC（防 NAND/eMMC 错配）
        run: |
          cd openwrt
          if ! grep -q '^CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_cmcc_xr30-emmc=y' .config; then
            echo "::error::目标设备不是 cmcc_xr30-emmc (XR30 eMMC)，编译中止以免产出错误固件"
            exit 1
          fi
          if grep -q '^CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_cmcc_xr30=y' .config; then
            echo "::error::同时启用了 cmcc_xr30 (XR30 NAND)，编译中止"
            exit 1
          fi
          echo "✅ 目标设备已确认为 XR30 eMMC (cmcc_xr30-emmc)"

      - name: 下载源码包（make download）
        run: cd openwrt && make download -j$(nproc)

      - name: 编译固件
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 || make -j1 V=s

      - name: 校验关键包确实编入固件（manifest 防呆）
        run: |
          cd openwrt
          MAN=$(ls bin/targets/mediatek/mt7981/*.manifest 2>/dev/null | head -1)
          if [ -z "$MAN" ]; then echo "::error::未找到 manifest，无法确认包是否编入"; exit 1; fi
          echo "=== manifest 中的 LuCI 应用/主题 ==="
          grep -E '^luci-(app|theme)-' "$MAN" || true
          PKGS="luci-theme-argon luci-app-openclash"
          for p in $PKGS; do
            if ! grep -qE "^${p}( |$)" "$MAN"; then
              echo "::error::${p} 未编入固件，中止以免交付空壳"
              exit 1
            fi
          done
          echo "✅ 关键包校验通过: $PKGS"

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xr30-emmc-openclash-firmware
          path: |
            openwrt/bin/targets/mediatek/mt7981/*cmcc_xr30-emmc*.bin
            openwrt/bin/targets/mediatek/mt7981/sha256sums
            openwrt/bin/targets/mediatek/mt7981/*.manifest
          if-no-files-found: warn
